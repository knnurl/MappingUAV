    package: px4_odom_bridge (main)
    claim_untested: "EV sanity guard behaviour against the live chain: that FAST-LIO -> bridge -> PX4 runs for a full session with the guard FORWARDING and zero rejections, and that a real LiDAR power cut latches it BLOCKED on the vehicle as it does in replay. Verified so far only against recorded fixtures from the 2026-09-14 incident (68 tests, mutation-checked) and a fake-LIO/fake-PX4 node harness — never with the LiDAR and FC actually powered."
