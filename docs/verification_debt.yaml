    discharge_path: "spec §6 step 6: chain up healthy, confirm /px4_odom_bridge/status reports FORWARDING with the forwarded count rising and zero rejections over 10 min; then, at a time of the operator's choosing, pull LiDAR power deliberately and confirm the guard latches BLOCKED, the bridge stops publishing, and PX4 holds its own estimate. Do this on the bench, props off, before any gate 4 flight."
    status: OPEN
