# filepath: src/drone_bringup/config/as2/pid_speed_controller.yaml
# WP-B: AS2 pid_speed_controller starting gains for the X500.
# UNTUNED CONSERVATIVE STARTING POINTS — deliberately soft. Tuning is a HUMAN
# activity at Gate 5/6 on the tether (masterplan §6/§7); do not "improve"
# these values from the bench. Structure mirrors the plugin's
# controller_default.yaml (verified against the installed 1.1.3 deb).
/**:
  ros__parameters:
    proportional_limitation: true
    position_control:
      reset_integral: true
      antiwindup_cte: 1.0
      alpha: 0.1
      kp: {x: 0.75, y: 0.75, z: 0.6}
      kd: {x: 0.0, y: 0.0, z: 0.0}
      ki: {x: 0.0, y: 0.0, z: 0.0}
    speed_control:
      reset_integral: true
      antiwindup_cte: 1.0
      alpha: 0.1
      kp: {x: 1.0, y: 1.0, z: 0.8}
      kd: {x: 0.0, y: 0.0, z: 0.0}
      ki: {x: 0.05, y: 0.05, z: 0.05}
    speed_in_a_plane_control:
      reset_integral: true
      antiwindup_cte: 1.0
      alpha: 0.1
      height: {kp: 0.8, kd: 0.0, ki: 0.05}
      speed:
        kp: {x: 1.0, y: 1.0}
        kd: {x: 0.0, y: 0.0}
        ki: {x: 0.05, y: 0.05}
    trajectory_control:
      # Trajectory path deliberately NOT enabled at Gate 5 [FIXED]; zeros
      # keep it inert if something requests it anyway.
      reset_integral: false
      antiwindup_cte: 0.0
      alpha: 0.0
      kp: {x: 0.0, y: 0.0, z: 0.0}
      kd: {x: 0.0, y: 0.0, z: 0.0}
      ki: {x: 0.0, y: 0.0, z: 0.0}
    yaw_control:
      reset_integral: false
      antiwindup_cte: 0.5
      alpha: 0.1
      kp: 1.5
      kd: 0.0
      ki: 0.0
