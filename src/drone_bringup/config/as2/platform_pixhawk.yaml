# filepath: src/drone_bringup/config/as2/platform_pixhawk.yaml
# WP-B: as2_platform_pixhawk configuration for the X500.
# ARCHITECTURAL CONSTRAINTS [FIXED, masterplan §7]:
#  - external_odom stays FALSE: px4_odom_bridge (Gate 3) is the ONLY writer
#    of /fmu/in/vehicle_visual_odometry, and EKF2 is the one estimator of
#    record. Setting this true would make the platform republish AS2's
#    odometry (EKF2's own output) into EKF2's EV input at 100 Hz: a feedback
#    loop that outvotes LIO 10:1. gate5_as2.launch.py refuses to launch unless
#    this is false.
#  - X500 hover thrust ~ mid-stick; max_thrust bounds the attitude-mode
#    thrust mapping. Values below are bench-safe placeholders; the platform
#    is not integrated on the vehicle until the gate5 token anyway.
/**:
  ros__parameters:
    cmd_freq: 100.0          # Hz of platform command stream (offboard keepalive)
    info_freq: 10.0
    max_thrust: 25.0         # N, ~4x X500 hover thrust headroom [MEASURE at gate5 tuning]
    min_thrust: 0.5          # N
    external_odom: false     # [FIXED] see header
    fmu_prefix: ''
    target_system_id: 1
