# filepath: src/drone_bringup/config/geofence.yaml
# Geofence watchdog parameters. Box is in the PX4 local NED frame (z DOWN):
# a 2.5 m ceiling is z_min: -2.5. Defaults sized for the Gate 4 tethered test
# volume (>= 3 x 3 x 2.5 m); RESIZE for the actual room before Gate 5.
# AXES: the NED origin and axes are fixed where/how FAST-LIO starts, not by the
# compass. px4_odom_bridge maps the vehicle's STARTUP forward direction to +y
# (East) and its startup LEFT to +x (North). Size y along the startup-forward
# extent of the room and x along the startup-left extent, and always start LIO
# at the same pose and heading or the box lands somewhere else in the room.
geofence_watchdog:
  ros__parameters:
    x_min: -1.5
    x_max: 1.5
    y_min: -1.5
    y_max: 1.5
    z_min: -2.5          # flight ceiling (NED, up = negative)
    z_max: 0.3           # floor bound with ground tolerance
    soft_margin: 0.5     # masterplan default
    hysteresis: 0.2
    lio_timeout_s: 1.0   # masterplan: LIO silence > 1.0 s -> land
    estimate_timeout_s: 1.0
    # After this many seconds from watchdog start, a stream that has NEVER
    # arrived counts as silent (-1 disables; set e.g. 10.0 for flight ops
    # where the pipeline must already be up):
    require_streams_after_s: -1.0
    cmd_resend_period_s: 1.0
