# filepath: src/drone_bringup/config/exploration/frontier_explorer.yaml
# WP-F explorer parameters (spec docs/wp-f_frontier_explorer_spec.md §5).
# Read once at node start. Frame: odom / ENU.
frontier_explorer:
  ros__parameters:
    # Box, grid and band (must equal the planner box: generate with scripts/venue_boxes.py)
    x_min: -4.5
    x_max: 4.5
    y_min: -4.5
    y_max: 4.5
    z_min: 0.2
    z_max: 2.3
    obstacle_inflation: 0.4
    resolution: 0.2
    z_fly: 1.3
    band_half_layers: 0
    max_grid_cells: 40000
    # Map sampling
    cycle_period_s: 2.0
    max_points_per_request: 4096
    query_timeout_s: 1.0
    map_fail_max: 3
    map_ready_min_free_cells: 50
    wait_map_timeout_s: 30.0
    # Frontier extraction
    min_unknown_region_cells: 9
    min_cluster_cells: 3
    max_clusters: 32
    # Traversability and viewpoints
    traverse_clearance_m: 0.4
    goal_clearance_m: 0.6
    unknown_standoff_m: 0.6
    allow_tight_goals: true
    view_range_m: 3.0
    candidate_stride_cells: 2
    max_candidates_per_cluster: 256
    max_gain_samples: 64
    start_snap_radius_m: 0.6
    # Selection
    distance_weight: 1.0
    switch_margin: 2.0
    # Goal lifecycle
    reach_tolerance_xy_m: 0.3
    reach_tolerance_z_m: 0.3
    nominal_speed_m_s: 0.5
    goal_timeout_factor: 3.0
    goal_timeout_min_s: 20.0
    progress_window_s: 15.0
    progress_min_m: 0.3
    start_motion_timeout_s: 5.0
    reject_window_s: 1.0
    blacklist_radius_m: 1.0
    visited_radius_m: 0.6
    blacklist_max_entries: 64
    blacklist_ttl_s: 0.0
    # Termination
    done_confirm_cycles: 3
    max_mission_s: 900.0
    on_done: hold
    # Interlocks
    pose_timeout_s: 0.5
    platform_info_timeout_s: 2.0
    lio_heartbeat_timeout_s: 3.0
    fence_heartbeat_timeout_s: 1.5
    frame_divergence_max_m: 0.5
    frame_divergence_persist_s: 1.0
    frame_check_max_dt_s: 0.2
    remote_param_timeout_s: 2.0
    # Battery (I10) and odometry bridge (I11), added 2026-11-16
    battery_min_fraction: 0.25
    battery_timeout_s: 10.0
    battery_required: true
    bridge_heartbeat_timeout_s: 2.0
    # Interfaces
    as2_namespace: drone0
    goal_frame_id: odom
    shim_node: /go_to_with_avoidance
    map_node: /map_interface
    fence_node: /geofence_watchdog
    publish_markers: false
    lio_odom_topic: /Odometry
    max_plan_time_s: 1.0
